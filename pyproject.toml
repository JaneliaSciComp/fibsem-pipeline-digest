[project]
name = "fibsem-summarizer"
version = "0.1.0"
description = "Fetch FIB-SEM dataset issues from a GitHub Projects v2 board and summarize them with claude -p."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "click>=8.1",
    "markdown-it-py>=3.0",
    "python-pptx>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fibsem_summarizer"]
