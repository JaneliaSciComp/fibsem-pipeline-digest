[project]
name = "fibsem-digest"
version = "0.1.0"
description = "Fetch FIB-SEM dataset reconstruction status from a GitHub project and summarize them with Claude."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "click>=8.1",
    "markdown-it-py>=3.0",
    "weasyprint>=62",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fibsem_digest"]
